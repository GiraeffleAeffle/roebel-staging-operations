name: Case runtime upgrade rehearsal
on:
  pull_request:
    paths:
      - scripts/case_runtime_upgrade.mjs
      - scripts/case_upgrade_runtime.mjs
      - scripts/case_upgrade_worker.py
      - scripts/test_case_upgrade_worker.py
      - scripts/run-case-runtime-upgrade.mjs
      - scripts/case_review_backup.mjs
      - scripts/test_case_runtime_upgrade.mjs
      - scripts/test_case_review_migration.mjs
      - scripts/town_workspace_connection.py
      - scripts/test_town_workspace_connection.py
      - proposals/town-workspace-connection/rollout.json
      - reviewed-render/roebel-staging/**
      - .github/workflows/case-runtime-upgrade.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  replay-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source_revision:
          - e44dfd20367287724fe9b42d84144574c957ea23
          - 9010479b00f58ff4623c26ef993365e47b168224
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: operations
          # The offline worker test reads its pinned predecessor from Git.
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GiraeffleAeffle/stadtstack
          ref: ${{ matrix.source_revision }}
          path: case-upgrade-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.18.0
      - name: Install the published runtime dependencies
        working-directory: case-upgrade-source
        run: npm ci --ignore-scripts
      - name: Rehearse real reviewed Case upgrade, interruption recovery and backup guards
        working-directory: operations
        env:
          CASE_UPGRADE_TEST_SOURCE_REVISION: ${{ matrix.source_revision }}
        run: |
          CASE_UPGRADE_TEST_SOURCE_ROOT="$GITHUB_WORKSPACE/case-upgrade-source" node --test scripts/test_case_runtime_upgrade.mjs
          node --test scripts/test_case_review_migration.mjs
          python3 -B -m unittest scripts.test_case_upgrade_worker
