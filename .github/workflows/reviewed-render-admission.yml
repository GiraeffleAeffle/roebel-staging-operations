name: reviewed-render-admission

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: reviewed-render-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reviewed-render-admission:
    name: reviewed-render-admission
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out protected base
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
          fetch-depth: 1

      - name: Check out untrusted candidate as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pull request with protected base policy
        if: github.event_name == 'pull_request_target'
        run: |
          python3 -m unittest -v base/scripts/test_verify_reviewed_render.py
          python3 base/scripts/verify-reviewed-render.py --root candidate --base-root base

      - name: Check out protected main
        if: github.event_name == 'push'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Verify protected main
        if: github.event_name == 'push'
        run: |
          python3 -m unittest -v candidate/scripts/test_verify_reviewed_render.py
          python3 candidate/scripts/verify-reviewed-render.py --root candidate
